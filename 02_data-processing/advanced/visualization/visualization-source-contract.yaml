# Visualization Source Contract v1.0
# Mapping from MY-SKILLS facts to the typed IR. Not a copy of any external schema.
version: "1.0"
approved: "2026-10-03"
role: mapping-contract

views:
  architecture:
    question: "What the system is made of and where the boundaries are."
    inputs:
      - ARCHITECTURE.md
      - 00_orchestrator/registry.yaml
      - top-level directories 00_orchestrator through 07_response
    ir_fields: [components, boundaries, connections]
    primary_component_band: "about 6-12 stable system components"
  workflow:
    question: "How a task runs, including branches, exceptions, and loops."
    inputs:
      - 00_orchestrator/runtime-flow.mmd
      - 00_orchestrator/runtime-flow.md
      - 00_orchestrator/gates.md
    ir_fields: [lanes, phases, groups, mainPath, nodes, edges]
    geometry: workflow-schema-version-2
    must_show:
      - layers 00 through 07 (07 = response)
      - Lit05
      - Lit06
      - mid-entry
      - G-07
  registry_index:
    question: "Which in-repo fine ids the registry indexes, and the status recorded there."
    inputs:
      - 00_orchestrator/registry.yaml
    not_inputs:
      - a crawl of skill files outside registry.yaml
  skill_pages:
    question: "Documentation pages from skill sources. Do not force prose into a diagram."
    inputs:
      - SKILL.md frontmatter under 00_orchestrator through 07_response

forbidden_fact_sources:
  - LLM inference
  - generated HTML
  - previous generated HTML
  - arbitrary external-file crawling
  - filename alone
  - visual appearance
  - unvalidated JSON

rules:
  - MY-SKILLS is the only source of truth.
  - Workflow IR is a hand-maintained structured map of runtime-flow.mmd (+ runtime-flow.md anchors), not an auto-parsed Mermaid AST.
  - Rendering IR to HTML is local and read-only; no external renderer runs.
  - Top-level 07_response is allowed (response letters); do not add other top-level 07* skills.
  - Registry diagrams come from registry.yaml.
  - Delta describes structural facts only.
  - Generated HTML is rebuildable and is not a fact source.
  - Do not crawl outside this repo for skill bodies.
