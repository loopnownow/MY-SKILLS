# Visualization compiler.
# --check rebuilds IR in memory and renders with the vendored Archify zip.
# It does not write. A shape or render failure leaves last-good files in place.
# auto_update is false. This workflow does not download Archify.
# GitHub Pages is not configured here.

name: visualization

"on":
  push:
    paths:
      - "00_orchestrator/runtime-flow.md"
      - "00_orchestrator/runtime-flow.mmd"
      - "00_orchestrator/gates.md"
      - "00_orchestrator/archify-version.yaml"
      - "00_orchestrator/archify-v3.0.1.zip"
      - "00_orchestrator/visualization-source-contract.yaml"
      - "00_orchestrator/visualization-architecture.md"
      - "00_orchestrator/scripts/gen_visualization.py"
      - "00_orchestrator/SKILL.md"
      - "01_skill-discovery-integration/registry.yaml"
      - "01_skill-discovery-integration/sources/**"
      - "01_skill-discovery-integration/mounts/presets/**"
      - "ARCHITECTURE.md"
      - "**/SKILL.md"
      - "docs/**"
      - ".github/workflows/visualization.yml"
  pull_request:
    paths:
      - "00_orchestrator/runtime-flow.md"
      - "00_orchestrator/runtime-flow.mmd"
      - "00_orchestrator/gates.md"
      - "00_orchestrator/archify-version.yaml"
      - "00_orchestrator/archify-v3.0.1.zip"
      - "00_orchestrator/visualization-source-contract.yaml"
      - "00_orchestrator/visualization-architecture.md"
      - "00_orchestrator/scripts/gen_visualization.py"
      - "00_orchestrator/SKILL.md"
      - "01_skill-discovery-integration/registry.yaml"
      - "01_skill-discovery-integration/sources/**"
      - "01_skill-discovery-integration/mounts/presets/**"
      - "ARCHITECTURE.md"
      - "**/SKILL.md"
      - "docs/**"
      - ".github/workflows/visualization.yml"

permissions:
  contents: read

jobs:
  ir-and-docs:
    name: IR, render, and docs check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check "pyyaml==6.0.2"

      - name: Show the runner Node used by the pinned renderer
        run: node --version

      - name: Check IR, docs, and pinned Archify render
        run: python3 00_orchestrator/scripts/gen_visualization.py --check

      - name: Record offline fail-closed policy
        run: |
          echo "auto_update is false."
          echo "Fail closed: --check does not write docs/."
          echo "Render uses 00_orchestrator/archify-v3.0.1.zip."
          echo "This job does not download tt-a1i/archify."
