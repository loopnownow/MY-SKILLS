# Mount pointers live only in 01.
# Human board: mounts/*.md (README index + b.md / ars.md / medsci.md / scientific.md)
# Per-source config: sources/<source>.yaml (one external repo per file).
# Default source is B (loopnownow/MY-SKILLS-capabilities).
# Empty mount → notify the user, then re-search and confirm. Do not silently fall back.
# Never auto-mount a non-B source. PROPOSED is not MOUNTED.
# Coarse ids follow Scientific Agent Skills jobs (CHG-20260903-008).
# Retired: 03-literature, 03-design, 03-frontier, 04-stats-generic, 05-writing-generic, 06-review-generic.
default_source:
  id: my-skills-capabilities
  source: https://github.com/loopnownow/MY-SKILLS-capabilities
  role: default-mount
empty_mount: notify-then-research-confirm
