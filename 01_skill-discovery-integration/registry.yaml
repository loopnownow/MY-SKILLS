# MY-SKILLS Mount Registry v4.0 (CHG-20260913-001)
# Structure: 10 coarse stage buckets (焊死) > fine IDs (session-pick mount points) > one atomic skill each.
# Hybrid mount: different fine IDs may use different packages; never mix packages inside one fine ID.
# Default source is B (loopnownow/MY-SKILLS-capabilities). Never auto-mount non-B. PROPOSED ≠ MOUNTED.
# ars_openclaw_policy: removed-from-catalog — never remount; not in session pick.
# Nature fine IDs: LICENSE Apache-2.0 verified 2026-09-14 (Yuan1z0825/nature-skills @287ee37; third-party, not Springer Nature official). MOUNTED allowed when bytes present.
# Session: ask-each-run multi-select fine IDs under relevant coarse. Empty mount → notify-then-confirm.
# Say 默认挂载 B 包/本仓 — not 空挂. Local bytes: ../mounts-cap/ (B full; backups on-demand).
# A domains stay 00_orchestrator … 06_review (+ skill-harvest). Do not rename A into Chinese top-level folders.
# 选刊 stays Victor / 03_research/medical-journal-submit — not moved into 05.
# Backup of v3.30: _history/registry.v3.30.yaml
# Migration map: mounts/MIGRATION_v3_to_v4.md
meta:
  version: "4.0"
  change_id: CHG-20260913-001
  previous_versions: ["1.0 (30 coarse ids)", "2.0 (13 switches)", "3.0 (draft, superseded)", "3.30 (_history/registry.v3.30.yaml)"]
  fine_id_count_canonical: 52  # session-pick mounts; reference_only empty
  fine_id_expansion_ceiling: 52  # v4 ceiling; new capability → merge into existing fine id / sub-capability / same source-path — not a new fine id
  load_priority_scheme: >
    Optional YAML-only field on each fine id: P0|P1|P2. No P0/P1/P2 directories.
    P0 reserved for rare always-on mounts (chassis is 00–06, not fine ids; Batch 1 assigns none).
    P1 common mounts (verify-refs, write-paper, check-reporting, analyze-stats, make-figures/fig-plot,
    peer-review, lit-search, imaging-io, preprocess-imaging, revise, self-review, …).
    P2 niche / PROPOSED / specialty.
    Registry indexes → cache (mounts-cap/<atomic_package>/) is SSOT for external skill bytes;
    stub_in_b is pointer-only (cross-pack/… or external-principles.md), never a second entity tree.
  coarse_id_count: 10
  open_decision_points:
    - id: 样本量计算归属
      status: defaulted
      current_default: 研究设计 (calc-sample-size / statistical-power)
      alternative: 统计分析
      note: 用户未最终拍板；本 registry 按研究设计实现，搬动仅两细ID。
default_source:
  id: my-skills-capabilities
  source: https://github.com/loopnownow/MY-SKILLS-capabilities
  role: default-mount
empty_mount: notify-then-research-confirm
session_mount: ask-each-run
session_pick_unit: fine_id
ars_openclaw_policy: removed-from-catalog
a_domain_override_policy: >
  Each coarse_id declares a default a_domain. A mount under `mounts:` may set
  its own `a_domain` to override that default when the routing rule requires
  it (documented exceptions: `find-journal` and `grant-builder` sit under
  coarse 正文写作 but route to a_domain 03_research per the 选刊/基金 rule in
  ARCHITECTURE.md). This is intentional, not a data-entry error — do not
  "fix" a mount's a_domain to match its coarse_id's default without checking
  its `note` field first.

