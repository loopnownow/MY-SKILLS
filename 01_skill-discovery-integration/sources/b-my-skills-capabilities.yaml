    a_step: 采集前实验设计
    interface: dual-track
  - id: 03-design-grant
    path: 03-research/design/
    a_hook: 03_research
    a_step: 标书（通用）；个人 Voice A/B 优先
    interface: dual-track
  - id: 03-frontier-ideate
    path: 03-research/frontier/
    a_hook: 03_research
    a_step: 选题 / 头脑风暴
    interface: dual-track
  - id: 03-frontier-hypothesize
    path: 03-research/frontier/
    a_hook: 03_research
    a_step: 问题化 / 假说
    interface: dual-track
  - id: 04-stats-guide
