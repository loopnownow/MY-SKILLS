# One config file per external source (recommended).
# Human board: ../mounts/README.md   Canonical index: ../registry.yaml
source_id: my-skills-capabilities
name: MY-SKILLS-capabilities
role: default-mount
repo: https://github.com/loopnownow/MY-SKILLS-capabilities
status: MOUNTED
empty_mount: notify-then-research-confirm
notes: >
  Default B pack. de-AI is not here (A 05_manuscript/personal).
  30 coarse ids after CHG-20260903-011. 04-explainability and 05-humanize are MedSci-only.
  03 A copies still literature/design/frontier (dual-track, not split).
skills:
  - id: 02-tables
    path: 02-data-processing/tables/
    a_hook: 02_data-processing
    a_step: 临床表 Excel / CSV（含缺失/异常值）
    interface: ready
  - id: 02-imaging-io
    path: 02-data-processing/imaging-io/
    a_hook: 02_data-processing
    a_step: CT/MRI 读写 · DICOM / NIfTI / NII
    interface: ready
  - id: 02-imaging-qc
    path: 02-data-processing/imaging-qc/
    a_hook: 02_data-processing
    a_step: CT/MRI QC · ROI / 阅片
    interface: ready
  - id: 02-pictures
    path: 02-data-processing/pictures/
    a_hook: 02_data-processing
    a_step: 图片 TIFF / PNG / JPG / PDF(图)
    interface: ready
  - id: 02-fmri
    path: 02-data-processing/fmri/
    a_hook: 02_data-processing
    a_step: fMRI · DICOM / NIfTI
    interface: ready
  - id: 02-radiomics-habitat
