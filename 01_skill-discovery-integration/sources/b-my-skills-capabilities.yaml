# One config file per external source (recommended).
# Human board: ../mounts/README.md   Canonical index: ../registry.yaml
source_id: my-skills-capabilities
name: MY-SKILLS-capabilities
role: default-mount
repo: https://github.com/loopnownow/MY-SKILLS-capabilities
status: MOUNTED
empty_mount: notify-then-research-confirm
notes: >
  Default B pack. de-AI is not here (A 05_manuscript/personal).
  Coarse ids split by Scientific jobs; several A ids share one B folder.
  03 literature/design/frontier still have A copies (dual-track).
skills:
  - id: 02-xlsx
    path: 02-data-processing/xlsx/
    a_hook: 02_data-processing
    a_step: Excel / CSV → 分析可用表
    interface: ready
  - id: 02-imaging-qc
    path: 02-data-processing/imaging-qc/
    a_hook: 02_data-processing
    a_step: 影像预处理与 QC
    interface: ready
  - id: 02-radiomics-habitat
    path: 02-data-processing/radiomics-habitat/
    a_hook: 02_data-processing
    a_step: radiomics / 生境准备（建模交 04）
    interface: ready
  - id: 02-impute
    path: 02-data-processing/impute/
    a_hook: 02_data-processing
    a_step: 缺失 / 异常值
    interface: ready
  - id: 02-generic-docs
    path: 02-data-processing/generic-docs/
    a_hook: 02_data-processing
    a_step: 通用影像/数据说明
    interface: ready
  - id: 03-lit-search
    path: 03-research/literature/
    a_hook: 03_research
    a_step: 文献检索 / 全文
    interface: dual-track
  - id: 03-lit-review
    path: 03-research/literature/
    a_hook: 03_research
    a_step: 综述 / 综合
    interface: dual-track
  - id: 03-lit-cite
    path: 03-research/literature/
