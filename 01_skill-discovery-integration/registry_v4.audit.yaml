# ============================================================
# MY-SKILLS Registry v4.0
# 生成日期: 2026-09-13
# 结构: 10个粗ID(焊死) > 细ID(挂载点，可增删改) > 原子技能(单包不拼接)
# 依据: 对5个候选源(MedSci/Scientific/OpenClaw/AIPOCH/Nature)
#       116+19份真实SKILL.md的逐份调研 + 用户实际使用习惯多轮确认
# ============================================================

meta:
  version: "4.0"
  previous_versions: ["1.0 (30 coarse ids)", "2.0 (13 switches)", "3.0 (draft, superseded)"]
  structure_principle: |
    粗ID = 10个，焊死，未来不再新增/删除/改名。
    细ID = 真正的挂载点/开关面板，skill-harvest的一切进化提案
      (新增/替换来源包/降级/合并)只作用在这一层，不触碰粗ID。
    原子技能 = 每个细ID对应且仅对应一个来源包的一个技能，禁止
      在同一次调用内拼接多个包的逻辑；不同细ID可以用不同包
      （“混合挂载”），但同一细ID内部不可混包。
  b_package_default: >
    B(loopnownow/MY-SKILLS-capabilities)是默认挂载包。标注✅的细ID
    直接使用B已有内容；标注🟡的是本次审计发现B遗漏、需要新增挂载的
    MedSci本体技能；标注🔵的是B默认不含、需要跨包连接的细ID；
    标注⚪的是“仅规则参考”，不发生实际跨包调用，原则已直接写入
    对应B技能的external-principles.md。
  input_precondition: >
    “数据处理”粗ID下处理的表格/影像数据，均假设已在导出时完成
    人工脱敏。00_orchestrator不再为PHI检测单独设路由分支
    (deidentify已归档，见archived区)。
  open_decision_points:
    - id: 样本量计算归属
      status: 未最终确认
      current_default: 归入“研究设计”(calc-sample-size/statistical-power)
      alternative: 归入“统计分析”
      note: 用户曾提出可能更习惯与统计检验方法放一起，尚未拍板，
        当前registry按“研究设计”归属实现，如需调整只需搬动这
        两个细ID条目，不影响其他结构。

# ============================================================
# 十个粗ID（焊死）
# ============================================================
coarse_ids:

  # ---------------- 1. 文献检索 ----------------
  - id: 文献检索
    fine_ids:
      - id: 广度检索
        status: 🔵跨包补充
        atomic_skill: {name: paper-lookup, package: Scientific}
        note: 18个学术API(PubMed/PMC/EuropePMC/bioRxiv/OpenAlex/Crossref/S2/
          CORE/Unpaywall/OpenCitations/PubTator3/Zenodo/Figshare/ROR/
          BioStudies/DOAJ)，覆盖面五源最广。
      - id: 引用真实性核验
        status: ✅B默认已含
        atomic_skill: {name: verify-refs, package: MedSci}
        note: 逐句核对“引用是否真的支撑论述”(claim fidelity)，五源唯一。
      - id: 引用格式化写入
        status: ✅B默认已含
        atomic_skill: {name: manage-refs, package: MedSci}
        note: 读写分离设计，pandoc citeproc/Zotero域代码注入。
      - id: 个人文献库同步
        status: ✅B默认已含
        atomic_skill: {name: lit-sync, package: MedSci}
        note: 同步Zotero+Obsidian，citekey溯源伪造检测，五源唯一。
      - id: 撤稿检测
        status: 🔵跨包补充
        atomic_skill: {name: retraction-watcher, package: AIPOCH}
        note: 投稿前扫描参考文献是否已撤稿/勘误/被标记。
      - id: 严格他引审计
        status: 🔵跨包补充
        atomic_skill: {name: nature-academic-search, package: Nature}
        license_flag: 需核实
        note: 排除自引，判定他引者身份画像，对基金/职称场景实用。

  # ---------------- 2. 选题探索 ----------------
  - id: 选题探索
    fine_ids:
      - id: 队列选题空白发现
        status: ✅B默认已含
        atomic_skill: {name: find-cohort-gap, package: MedSci}
        note: PI画像→交叉矩阵→文献饱和度扫描→6模式打分→可行性关卡，
          唯一真正做“依托医院队列找选题”的技能。
      - id: MA选题可行性
        status: ✅B默认已含
        atomic_skill: {name: ma-scout, package: MedSci}
        note: Professor-first/Topic-first双模式，MA数量vs原始研究数量
          饱和度判断。原属已归档的03-lit-review，核心功能保留于此。
      - id: 假设形成防HARKing
        status: 🔵跨包补充
        atomic_skill: {name: hypothesis-generation, package: Scientific}
        note: 防HARKing方法论——先生成竞争性解释再选检验方法，
          全场方法论最严谨的假设形成工具。
      - id: 项目启动分类
        status: 🟡新增挂载
        atomic_skill: {name: intake-project, package: MedSci}
        note: 新项目开局分类/状态重建/项目记忆脚手架(生成PROJECT.md)。
          原30-id列表遗漏，本次审计新发现。

  # ---------------- 3. 研究设计 ----------------
  - id: 研究设计
    fine_ids:
      - id: 研究设计审查
        status: ✅B默认已含
        atomic_skill: {name: design-study, package: MedSci}
        note: 放射影像/医学AI专用，含泄漏风险/对照设计/验证策略审查。
          原属已部分归档的03-design-experiment，MedSci本体部分单独保留。
      - id: AI专家评估设计
        status: 🟡新增挂载
        atomic_skill: {name: design-ai-benchmarking, package: MedSci}
        note: AI-vs-专家小组评估研究设计(reader study)：评分量表、
          校准探针、评审员小组构建、LLM-as-judge vs human-as-judge。
          原30-id列表遗漏，本次审计新发现，对放射组学/AI诊断研究价值高。
      - id: 模型架构选型
        status: 🟡新增挂载
        atomic_skill: {name: architecture-zoo, package: MedSci}
        note: 医学影像模型架构选型指南(ResNet/U-Net/nnU-Net/SAM/ViT/GNN等)，
          任务→架构决策树。原30-id列表遗漏，本次审计新发现。
      - id: IRB方案撰写
        status: ✅B默认已含
        atomic_skill: {name: write-protocol, package: MedSci}
        note: 整合design-study+calc-sample-size+search-lit的输出。
      - id: IRB方案填表
        status: 🟡新增挂载
        atomic_skill: {name: fill-protocol, package: MedSci}
        note: 与write-protocol配对——把内容填入机构自有Word表单模板，
          保留样式/表格/字体(支持中日韩)。原30-id列表遗漏，本次新发现。
      - id: 方案-按研究类型模板
        status: 🔵跨包补充
        atomic_skill: {name: clinic-research-design, package: AIPOCH}
        note: 诊断/疗效/病因/预后四类研究设计模板，内置样本量计算器。
      - id: 样本量计算
        status: ✅B默认已含
        atomic_skill: {name: calc-sample-size, package: MedSci}
        note: 覆盖影像AI专属场景(MRMC/分割精度Dice-HD95-NSD/Riley预测
          模型公式)。见open_decision_points关于归属的说明。
      - id: 样本量-复杂设计模拟法
        status: 🔵跨包补充
        atomic_skill: {name: statistical-power, package: Scientific}
        note: 蒙特卡洛模拟覆盖闭式解算不了的设计(混合模型/聚类RCT等)。

  # ---------------- 4. 正文写作 ----------------
  - id: 正文写作
    fine_ids:
      - id: IMRAD正文起草
        status: ✅B默认已含
        atomic_skill: {name: write-paper, package: MedSci}
        note: 8阶段+Critic打分门禁，产出仍需顶层“我的风格”再加工。
      - id: 报告规范核验
        status: ✅B默认已含
        atomic_skill: {name: check-reporting, package: MedSci}
        note: 覆盖49种报告规范+PRISMA级联算术核验，五源唯一完整覆盖。
      - id: 数据可用性声明
        status: 🔵跨包补充
        atomic_skill: {name: nature-data, package: Nature}
        license_flag: 需核实
      - id: 基金标书-中文语境QA
        status: 🔵跨包补充
        atomic_skill: {name: nature-proposal-writer, package: Nature}
        license_flag: 需核实
        note: 4层QA(evidence-before-prose, argument-before-sections)，
          五源里唯一贴近中文基金申报语境。
      - id: 基金标书-方法论
        status: ✅B默认已含
        atomic_skill: {name: grant-builder, package: MedSci}
      - id: 选刊推荐
        status: ✅B默认已含
        atomic_skill: {name: find-journal, package: MedSci}
        note: 唯一做选刊推荐引擎(含接收可行性预检)而非纯格式模板。
      - id: 期刊格式模板
        status: 🔵跨包补充
        atomic_skill: {name: venue-templates, package: Scientific}
        note: 强制时效性校验，覆盖期刊/会议/基金/海报四类。
    upstream_authority: 顶层风格_我的风格 (Aitor-format.md, stop-slop-core.md)

  # ---------------- 5. 语言润色 ----------------
  - id: 语言润色
    fine_ids:
      - id: 一致性硬规则lint
        status: ✅B默认已含
        atomic_skill: {name: polish-language, package: MedSci}
        note: 确定性非LLM判断规则化检测，“从不改动数字/引用/科学含义”硬约束。
      - id: 去AI味
        status: ✅B默认已含
        atomic_skill: {name: humanize, package: MedSci}
        note: 27模式6类别，含回复信专属(R2R)类别，五源唯一。
      - id: LaTeX排版细节
        status: 🔵跨包补充
        experimental: true
        atomic_skill: {name: nature-polishing, package: Nature}
        license_flag: 需核实
        note: 试验性——router架构，真实深度未完全展开验证。
    upstream_authority: 顶层风格_我的风格 (stop-slop-core.md, de-ai.md)

  # ---------------- 6. 数据处理 ----------------
  - id: 数据处理
    fine_ids:
      - id: 三阶段确认式清洗
        status: ✅B默认已含
        atomic_skill: {name: clean-data, package: MedSci}
        note: 画像→标记→生成代码，每步需研究者确认，从不自动清洗。
      - id: 批量队列分析生成
        status: ✅B默认已含
        atomic_skill: {name: batch-cohort, package: MedSci}
        note: “模板×变量组合”规模化生产，含跨国批量/NHIS索赔批量模式。
      - id: EDA
        status: 🔵跨包补充
        atomic_skill: {name: exploratory-data-analysis, package: Scientific}
        note: fail-closed设计——格式不支持直接拒绝而非猜测处理。
      - id: 预处理设计与泄漏门禁
        status: ✅B默认已含
        atomic_skill: {name: preprocess-imaging, package: MedSci}
        note: 预处理阶段泄漏检测(标准化器在非训练数据拟合等)，
          颗粒度五源最深。
      - id: DICOM底层与匿名化审计
        status: 🔵跨包补充
        atomic_skill: {name: pydicom, package: Scientific}
        note: 8个脚本含UID映射验证，底层操作比MedSci更深入。
      - id: 训练前数据集画像
        status: ✅B默认已含
        atomic_skill: {name: profile-imaging, package: MedSci}
        note: 五源唯一覆盖，捕捉“测试集无ground truth”等问题。
      - id: 部署级不确定性量化
        status: ✅B默认已含
        atomic_skill: {name: uncertainty-imaging, package: MedSci}
        note: MC-dropout/深度集成/共形预测+OOD检测，五源唯一覆盖。

  # ---------------- 7. 统计分析 ----------------
  - id: 统计分析
    fine_ids:
      - id: 检验方法选择与加权调查数据
        status: ✅B默认已含
        atomic_skill: {name: analyze-stats, package: MedSci}
        note: 唯一支持KNHANES/NHANES等复杂加权调查数据分析。
      - id: Meta分析抗数据操纵
        status: ✅B默认已含
        atomic_skill: {name: meta-analysis, package: MedSci}
        note: 队列重叠检测+2x2数据反推验真，全场method最严谨之一。
      - id: 生存分析leakage-safe管道
        status: 🔵跨包补充
        atomic_skill: {name: scikit-survival, package: Scientific}
        note: 含竞争风险的leakage-safe设计。
      - id: 放射组学建模pipeline审计
        status: ✅B默认已含
        atomic_skill: {name: radiomics-ml, package: MedSci}
        note: nested-CV+fold内特征选择+ICC稳定性过滤，learner-agnostic门禁。
      - id: 模型-任务正确指标选择
        status: ✅B默认已含
        atomic_skill: {name: model-evaluation, package: MedSci}
        note: 按任务类型选正确指标，门禁对照Metrics Reloaded/CLAIM 2024标准。
      - id: 模型-确定性泄漏门禁
        status: ✅B默认已含
        atomic_skill: {name: model-validation, package: MedSci}
        note: 集合运算证明患者级别split不重叠，金标准级别。

  # ---------------- 8. 图表呈现 ----------------
  - id: 图表呈现
    fine_ids:
      - id: 报告规范流程图与期刊配图
        status: ✅B默认已含
        atomic_skill: {name: make-figures, package: MedSci}
        note: 唯一覆盖STROBE/CONSORT/PRISMA流程图，含期刊AI图像政策
          前置检查。04-fig-flow已确认无外部真实替代，吸收于此。
      - id: 诚实可视化准则
        status: ⚪规则参考(非挂载)
        reference_source: {name: scientific-visualization, package: Scientific}
        applied_to: B/04-analysis/fig-plot/external-principles.md
      - id: 审稿人风险预判
        status: ⚪规则参考(非挂载)
        reference_source: {name: nature-figure, package: Nature}
        applied_to: B/04-analysis/fig-plot/external-principles.md

  # ---------------- 9. 稿件评阅（审稿） ----------------
  - id: 稿件评阅
    fine_ids:
      - id: PDF注入攻击扫描
        status: ✅B默认已含
        atomic_skill: {name: “peer-review(Phase1.5)”, package: MedSci}
        note: 提交前扫描PDF隐藏文本/prompt注入，五源唯一安全能力。
      - id: 审稿意见生成
        status: ✅B默认已含
        atomic_skill: {name: peer-review, package: MedSci}
        note: SI自我改进系统+期刊定制格式。
      - id: 数值级自审核算
        status: ✅B默认已含
        atomic_skill: {name: self-review, package: MedSci}
        note: n(%)/P值/PRISMA筛选数按分母/计数反推校验，全场无人能及。
      - id: 证据质量评估
        status: 🔵跨包补充
        atomic_skill: {name: scientific-critical-thinking, package: Scientific}
        note: GRADE/Cochrane ROB框架，作为独立分析模式而非审稿报告生成。
      - id: 多审稿人隔离原则
        status: ⚪规则参考(非挂载)
        reference_source: {name: nature-reviewer, package: Nature}
        applied_to: B/06-review/review-peer/external-principles.md

  # ---------------- 10. 审稿回复 ----------------
  - id: 审稿回复
    fine_ids:
      - id: 修回分诊与数字血统追踪
        status: ✅B默认已含
        atomic_skill: {name: revise, package: MedSci}
        note: 五源唯一做数字血统追踪+低质量审稿意见应对策略。
      - id: 隔离与正文精简原则
        status: ⚪规则参考(非挂载)
        reference_source: {name: nature-response, package: Nature}
        applied_to: B/06-review/review-response/external-principles.md
      - id: 回复语气软化
        status: 🔵跨包补充
        atomic_skill: {name: response-tone-polisher, package: AIPOCH}
        note: 4类语气模式转换(防御性/甩锅/情绪化→礼貌学术表达)。

# ============================================================
# 归档区（8项，保留完整调研记录，可随时复活，不计入10粗ID/细ID总数）
# ============================================================
archived:
  - id: 02-fmri
    reason: 假匹配已核实——AIPOCH的neuropixels-analysis实为电生理记录分析，与fMRI无关
    revive_condition: 研究方向扩展至功能磁共振/电生理领域时重新评估
  - id: 02-pictures
    reason: 场景错位——五源内容全指向病理全切片图像/显微镜，非通用图片处理
    revive_condition: 涉及数字病理研究时重新评估histolab/pathml
  - id: 03-design-experiment(部分)
    reason: 仅归档Scientific/OpenClaw/AIPOCH的湿实验室DOE部分；MedSci的
      design-study/design-ai-benchmarking/architecture-zoo已移入“研究设计”
    revive_condition: 涉及前瞻性/湿实验设计需求时评估外部DOE内容
  - id: 04-explainability
    reason: 用户不使用——MedSci做像素级Grad-CAM，其余四源均为表格SHAP，
      两者范式不同无法互相替代
    revive_condition: 未来发表涉及模型可解释性论文时复活
  - id: 03-lit-fulltext
    reason: 用户不使用——MedSci(英文OA)与Nature(中文/CNKI)功能互补，已完整记录
    revive_condition: 需批量下载全文PDF(尤其中文核心期刊)时复活
  - id: 03-lit-review(部分)
    reason: 用户不使用综述全流程撰写；MedSci的ma-scout(MA选题可行性)
      已保留在“选题探索”，不受影响
    revive_condition: 承接系统综述/meta分析全文撰写委托时复活
  - id: deidentify
    reason: 用户确认医院数据导出时已完成人工脱敏，此技术能力不再需要
    revive_condition: 数据来源变化(如接入非脱敏实时院内系统)时复活
  - id: 05-write-venue(add-journal子项)
    reason: add-journal是find-journal数据库的维护工具(基础设施性质)，
      不是面向产出的技能，不设为细ID
    revive_condition: 不适用——性质决定不需要复活为细ID

# ============================================================
# 许可证治理规则
# ============================================================
governance_rules:
  - rule_id: openclaw-proprietary-blacklist
    severity: high
    description: >
      OpenClaw-Medical-Skills仓库内累计发现6处“MD BABU MIA, PhD”
      proprietary版权声明，与仓库README宣称的整体MIT协议矛盾，
      集中于bio-experimental-design-*、bio-machine-learning-*前缀
      及跨模态融合命名的技能。
    affected_files:
      - skills/bio-experimental-design-batch-design/SKILL.md
      - skills/bio-experimental-design-power-analysis/SKILL.md
      - skills/bio-machine-learning-model-validation/SKILL.md
      - skills/scientific-manuscript/SKILL.md
      - skills/multimodal-medical-imaging/SKILL.md
      - skills/radiomics-pathomics-fusion-agent/SKILL.md
    action: OpenClaw未被选为本registry任何细ID的atomic_skill来源，风险已规避。
      未来若考虑引用，必须逐文件核查版权头。

  - rule_id: scientific-xlsx-license-note
    severity: low
    description: Scientific(K-Dense)的xlsx技能标注license Proprietary，
      系改编自Anthropic官方技能仓库，与该仓库其余MIT技能不同。
    action: 本registry未引用该技能；未来需要时单独核实LICENSE.txt。

  - rule_id: aipoch-miscategorization-note
    severity: low
