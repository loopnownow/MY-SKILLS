# MY-SKILLS Mount Registry v4.0
# SSOT for session-pick / path resolve. Bodies live under NN_slug/base/ (source my-skills).
# Non-base = default deny (references/hybrid-mount-pointers.md). Never auto-mount non-base.
# ars_openclaw_policy: removed-from-catalog — never remount; not in session pick.
# Session: ask-each-run multi-select fine IDs under relevant coarse. Empty mount → notify-then-confirm.
# Canonical ID Rule: 01_skill-integration/references/id-rules.md. id is the only runtime identifier.
# path labels / directory names must never be used to infer an id.
# Retired fine ids live in legacy_aliases.yaml only (not listed here). Do not remount them.
# Live rows are status MOUNTED. Prefer merge into an existing fine id over opening a new one.
# Ownership / Track Changes / citation-verify policy: 00_orchestrator/references/ownership-contract.md
meta:
  version: '4.0'
  change_id: CHG-20261024-registry-thin
  fine_id_count_canonical: 27
  coarse_id_count: 10
default_source:
  id: my-skills
  source: in-repo
  role: default-mount
  note: Capability bodies live under NN_slug/base/ (domains 02–07).
empty_mount: notify-then-research-confirm
session_mount: ask-each-run
session_pick_unit: fine_id
ars_openclaw_policy: removed-from-catalog
a_domain_override_policy: 'Identity is a four-tuple plus an optional A pack: fine_id, coarse_id, a_domain,
  body path (NN_slug/base/...). Do not infer id from path or path from id. Each coarse_id declares a default
  a_domain. A mount may set its own a_domain to override that default when routing requires it (documented
  exceptions: find-journal and grant-builder sit under coarse manuscript-body but route to a_domain 03_research).
  fill-protocol stays a_domain 03_research. find-journal body is 03_research/base/find-journal/; companion
  styles in 05_manuscript/base/write-venue/. Do not force a mount a_domain to match its coarse default
  without checking this policy.'
