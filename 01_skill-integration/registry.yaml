# MY-SKILLS Mount Registry v4.0 (skill-index rewrite 2026-10-17)
# 01 = registry / session-pick / path resolve / legacy aliases / mounts_cap cache boundary.
# Default UNIQUE runtime source = my-skills-base (MY-SKILLS-base). No multi-package mount narrative.
# Non-base sources = default deny (see mounts/hybrid-mount-pointers.md). Never auto-mount non-base.
# ars_openclaw_policy: removed-from-catalog — never remount; not in session pick.
# Session: ask-each-run multi-select fine IDs under relevant coarse. Empty mount → notify-then-confirm.
# Say 默认挂载 B = 本仓 — not 空挂. Local base bytes: {mounts_cap}/b/ (alias OK) = D:/0Grok/0doc/04-lab-reference/mounts-cap/b.
# A domains stay 00_orchestrator – 07_response. A top layers are NOT capability mounts (00 owns B→QC→A).
# Evolution policy: MY-RULES skills.md (skill-evolution).
# 选刊 stays Victor / 03_research/find-journal — not moved into 05.
# fine_id is the capability interface. path is the physical unit. path_shared: one path may back several fine ids.
# Registry status values: PROPOSED, MOUNTED, DISABLED, ARCHIVED, REJECTED.
# registry.yaml is the routing index, not the byte source of truth.
# Canonical ID Rule: 01 references/id-rules.md. id is the only runtime and session-pick identifier.
meta:
  version: "4.0"
  change_id: CHG-20261007-001
  fine_id_count_canonical: 31  # session-pick mounts; reference_only empty; -12 archive/absorb 2026-10-17 round 2 (was 43 after round 1)
  fine_id_expansion_ceiling: 52  # v4 ceiling; new capability → merge into existing fine id / sub-capability / same source-path — not a new fine id
  load_priority_scheme: >
    Optional YAML-only field on each fine id: P0|P1|P2. No P0/P1/P2 directories.
    P0 reserved for rare always-on mounts (chassis is 00–06, not fine ids; Batch 1 assigns none).
    P1 common mounts (default session menu, about 25–30 MOUNTED ids).
    P2 niche / PROPOSED / specialty / second-pass (still pickable when selected).
        Registry indexes paths; base byte cache is {mounts_cap}/b/ (alias for my-skills-base). Bodies SSOT = B repo.
  coarse_id_count: 10
  open_decision_points:
    - id: 样本量计算归属
      status: resolved
      resolved: 2026-09-26 (CHG-20260926-004)
      decision: 统计分析 / 04_analysis / Loopnow (calc-sample-size; statistical-power archived 2026-10-17 round 1)
      note: 用户拍板归 04 / Loopnow；两细 ID 已移入统计分析。
    - id: citation-verify-on-05-06
      status: resolved
      resolved: 2026-10-02
      decision: >
        05 and 06 require 03 Victor citation-verify before Gate·05 done and inside 06.
        Aitee and Lee do not self-certify lit. Mid-entry stays allowed.
        Lee keeps statement then data consistency. Lit accuracy is joint with Victor.
      note: checklist is 03_research/personal/citation-verify.md. Not a new fine id.
    - id: word-tc-owned-by-aitee
      status: resolved
      resolved: 2026-10-02
      decision: >
        Ownership: see 00_orchestrator/references/ownership-contract.md
      note: >
        Retired default: Lee no longer applies body Track Changes on decidable fixes.
        Lit05/Lit06 and do-not-self-certify-lit stay as citation-verify-on-05-06. Not a new fine id.
default_source:
  id: my-skills-base
  source: https://github.com/loopnownow/MY-SKILLS-base
  role: default-mount
empty_mount: notify-then-research-confirm
session_mount: ask-each-run
session_pick_unit: fine_id
ars_openclaw_policy: removed-from-catalog
a_domain_override_policy: >
  Identity is a four-tuple plus an optional A pack: fine_id, coarse_id,
  a_domain, B path. Do not infer id from path or path from id.
  Each coarse_id declares a default a_domain. A mount under `mounts:` may set
  its own `a_domain` to override that default when the routing rule requires
  it (documented exceptions: `find-journal` and `grant-builder` sit under
  coarse manuscript-body (正文写作) but route to a_domain 03_research per the 选刊/基金 rule in
  ARCHITECTURE.md). `fill-protocol` stays a_domain 03_research; capability body is B
  `03-research/fill-protocol/`, A `03_research/fill-protocol/` is Bai seat pointer. `find-journal` A pack is `03_research/find-journal/`
  even when B path is `05-manuscript/write-venue/`. This is intentional, not a
  data-entry error — do not "fix" a mount's a_domain to match its coarse_id's
  default without checking its `note` field first.

