# Swappable core for default hybrid mount (v4 fine IDs).
# Unit of attribution / scoring / path fetch = source + pack skill (not whole source).
# Coarse buckets stay the session shell; fine ids are the picks. Mapping is not a mount.
preset_id: review-hybrid-default
version: "2026-10-17.3"
status: default-session-recipe
notes: >
  Default for review / pre-review: B chassis + B verify-refs
  (absorbed citation-management) + B analyze-stats (stats-guide).
  Former scientific-critical-thinking archived→self-review (round 3).
  Prefetch only listed skill paths. Catalog backups MedSci/Scientific/AIPOCH/Nature only.
  A 06 personal adjudicates.

chassis:
  source: my-skills-base
  role: base
  required: true

personal:
  - layer: 06_review/personal
    role: adjudication
    must_include: [review-resolution.md, 06_review/personal/review.md]

# Per fine-id overrides (v4). Must match registry.yaml source/path/status.
overrides:
  - id: verify-refs
    source: my-skills-base
    skills: [verify-refs]
    paths: [03-research/verify-refs/]
    role: literature-verify
    required: true
    prefix_example: "[B:verify-refs]"
  - id: analyze-stats
    source: my-skills-base
    skills: [stats-guide]
    paths: [04-analysis/stats-guide/]
    role: reported-stats-audit
    required: true
    prefix_example: "[B:04-analysis/stats-guide]"
  - id: self-review
    source: my-skills-base
    skills: [review-critique]
    paths: [06-review/review-critique/]
    role: logic-mechanism-overlay
    required: false
    status_note: covers former scientific-critical-thinking (archived round 3)
    prefix_example: "[B:self-review]"

force_b:
  - peer-review  # peer-review-pdf-scan absorbed 2026-10-17 round 2
  - revise
  - self-review  # scientific-critical-thinking archived→self-review round 3

excluded_sources: []
excluded_tools_note: "Out-of-band editors are suggestions-only; no silent numeric edits; must pass G0 if used as a mount. Catalog backups: MedSci/Scientific/AIPOCH/Nature only."

swappable: true
