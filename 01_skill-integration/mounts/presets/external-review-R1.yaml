# R1 external review — dual engines — A06 only.
preset_id: external-review-R1
version: "2026-10-17.3"
status: session-recipe
notes: >
  B/MedSci peer-review and self-review produce finding sets
  (self-review covers former scientific-critical-thinking, archived round 3).
  A06 personal merges, grades Major/Minor, owns envelope.
  Engines never edit the manuscript. Ask-each-run. Related to review-hybrid-default.

chassis:
  source: my-skills-base
  role: base
  required: true

personal:
  - layer: 06_review/personal
    role: adjudication
    must_include: [review-resolution.md, 06_review/personal/review.md]

overrides:
  - id: peer-review
    source: my-skills-base
    skills: [review-peer]
    paths: [06-review/review-peer/]
    role: clinical-reporting-findings
    required: true
    prefix_example: "[B:peer-review]"
  - id: self-review
    source: my-skills-base
    skills: [review-critique]
    paths: [06-review/review-critique/]
    role: pre-submission-integrity
    required: true
    status_note: covers former scientific-critical-thinking (archived round 3)
    prefix_example: "[B:self-review]"

force_b:
  - peer-review  # peer-review-pdf-scan absorbed 2026-10-17 round 2
  - revise
  - self-review

excluded_sources: []
excluded_tools_note: "Findings only; A06 adjudicates. Catalog backups: MedSci/Scientific/AIPOCH/Nature only."
swappable: true
