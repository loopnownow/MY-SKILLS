# L2 deep evidence check — discovery + verify (not triple search).
preset_id: evidence-deep-L2
version: "2026-09-20.1"
status: session-recipe
notes: >
  Literature deep check: B lit-search for discovery (paper-lookup archived 2026-10-17
  round 1), Scientific/MedSci verify-refs for claim–source fit. A03 owns evidence cards.
  Ask-each-run. Do not co-load a third AIPOCH literature-search by default.

chassis:
  source: my-skills-capabilities
  role: base
  required: true

personal:
  - layer: 03_research
    role: evidence-entry
  - layer: 05_manuscript/personal
    role: consumer-only
    note: 05 consumes verified cards; does not search

overrides:
  - id: lit-search
    source: my-skills-capabilities
    role: discovery
    required: true
    note: paper-lookup archived 2026-10-17 round 1; use B lit-search
  - id: verify-refs
    source: my-skills-capabilities
    skills: [verify-refs]
    paths: [03-research/verify-refs/]
    role: literature-verify
    required: true
    prefix_example: "[B:verify-refs]"

excluded_sources: []
excluded_tools_note: "No triple search default. Catalog backups: MedSci/Scientific/AIPOCH/Nature only."
swappable: true
