# W2 final manuscript — structure + personal voice + citation/reporting QC.
preset_id: manuscript-final-W2
version: "2026-09-20.1"
status: session-recipe
notes: >
  Final draft pass. write-paper may supply IMRAD structure; A/B05 personal owns
  sentence authority (Intro v3, de-AI). verify-refs and check-reporting are QC.
  Nature overlays only when venue-specific. Ask-each-run. First-pass write-paper/check-reporting must load B 05-manuscript/vocab/.

chassis:
  source: my-skills-base
  role: base
  required: true

personal:
  - layer: 05_manuscript/personal
    role: sentence-authority
    must_include: [Aitor-format.md, vocab/L1/ban-phrases.md, process/evidence.md]

overrides:
  - id: write-paper
    source: my-skills-base
    skills: [write-manuscript]
    paths: [05-manuscript/write-manuscript/]
    role: structure-draft
    required: true
    prefix_example: "[B:write-manuscript]"
  - id: verify-refs
    source: my-skills-base
    skills: [verify-refs]
    paths: [03-research/verify-refs/]
    role: literature-verify
    required: true
    prefix_example: "[B:verify-refs]"

  - id: check-reporting
    source: my-skills-base
    role: reporting-qc
    required: false

force_b: []
excluded_sources: []
excluded_tools_note: "One authoring authority (personal). Engines do not co-edit sentences. Catalog backups: MedSci/Scientific/AIPOCH/Nature only."
swappable: true
