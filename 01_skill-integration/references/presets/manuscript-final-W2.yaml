# W2 final manuscript — structure + personal voice + citation/reporting QC.
preset_id: manuscript-final-W2
version: "2026-09-20.1"
status: session-recipe
notes: >
  Final draft pass. First-pass fine-ID list: write-paper, verify-refs, check-reporting.
    A/B05 personal owns sentence authority. Ask-each-run. Chassis my-skills (in-repo base/) only.
    First-pass write-paper/check-reporting must load A 05_manuscript/base/vocab/.


chassis:
  source: my-skills
  role: base
  required: true

personal:
  - layer: 05_manuscript/personal
    role: sentence-authority
    must_include: [Aitor-format.md, 05_manuscript/base/vocab/L1/ban-phrases.md, process/evidence.md, 03_research/personal/citation-verify.md]

overrides:
  - id: write-paper
    source: my-skills
    skills: [write-manuscript]
    paths: [05_manuscript/base/write-manuscript/]
    role: structure-draft
    required: true
    prefix_example: "[write-manuscript]"
  - id: verify-refs
    source: my-skills
    skills: [verify-refs]
    paths: [03_research/base/verify-refs/]
    role: literature-verify
    required: true
    prefix_example: "[verify-refs]"

  - id: check-reporting
    source: my-skills
    role: reporting-qc
    required: false

force_fine_ids: []
excluded_sources: []
excluded_tools_note: "One authoring authority (personal). Engines do not co-edit sentences. Non-base default deny."
swappable: true
