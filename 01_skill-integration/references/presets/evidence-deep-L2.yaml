# L2 deep evidence check — discovery + verify (not triple search).
preset_id: evidence-deep-L2
version: "2026-09-20.1"
status: session-recipe
notes: >
  Literature deep check. First-pass fine-ID list: lit-search, verify-refs.
    A03 owns evidence cards. Ask-each-run. Chassis my-skills (in-repo base/) only.


chassis:
  source: my-skills
  role: base
  required: true

personal:
  - layer: 03_research
    role: evidence-entry
  - layer: 05_manuscript/personal
    role: consumer-only
    note: 05 consumes verified cards; does not search

overrides:
  - id: lit-search
    source: my-skills
    role: discovery
    required: true
    note: paper-lookup archived 2026-10-17 round 1; use B lit-search
  - id: verify-refs
    source: my-skills
    skills: [verify-refs]
    paths: [03_research/base/verify-refs/]
    role: literature-verify
    required: true
    prefix_example: "[B:verify-refs]"

excluded_sources: []
excluded_tools_note: "No triple search default. Non-base default deny."
swappable: true
