# R1 external review — dual engines — A06 only.
preset_id: external-review-R1
version: "2026-10-17.3"
status: session-recipe
notes: >
  External review. First-pass fine-ID list: peer-review, self-review.
    A06 personal merges findings. Engines never edit the manuscript. Chassis my-skills (in-repo base/) only.


chassis:
  source: my-skills
  role: base
  required: true

personal:
  - layer: 06_review/personal
    role: adjudication
    must_include: [06_review/personal/review.md, 07_response/personal/response.md]

overrides:
  - id: peer-review
    source: my-skills
    skills: [review-peer]
    paths: [06_review/base/review-peer/]
    role: clinical-reporting-findings
    required: true
    prefix_example: "[B:peer-review]"
  - id: self-review
    source: my-skills
    skills: [review-critique]
    paths: [06_review/base/review-critique/]
    role: pre-submission-integrity
    required: true
    status_note: covers former scientific-critical-thinking (archived round 3)
    prefix_example: "[B:self-review]"

force_b:
  - peer-review  # peer-review-pdf-scan absorbed 2026-10-17 round 2
  - revise
  - self-review

excluded_sources: []
excluded_tools_note: "Findings only; A06 adjudicates. Non-base default deny."
swappable: true
