# Swappable core for default hybrid mount (v4 fine IDs).
# Unit of attribution / scoring / path fetch = source + pack skill (not whole source).
# Coarse buckets stay the session shell; fine ids are the picks. Mapping is not a mount.
preset_id: review-hybrid-default
version: "2026-10-17.3"
status: default-session-recipe
notes: >
  Default for review / pre-review. First-pass fine-ID list:
    verify-refs, analyze-stats; force-B peer-review, revise, self-review.
    Chassis my-skills (in-repo base/) only. A 06 personal adjudicates. Prefetch listed paths only.


chassis:
  source: my-skills
  role: base
  required: true

personal:
  - layer: 06_review/personal
    role: adjudication
    must_include: [06_review/personal/review.md, 07_response/personal/response.md]

# Per fine-id overrides (v4). Must match registry.yaml source/path/status.
overrides:
  - id: verify-refs
    source: my-skills
    skills: [verify-refs]
    paths: [03_research/base/verify-refs/]
    role: literature-verify
    required: true
    prefix_example: "[verify-refs]"
  - id: analyze-stats
    source: my-skills
    skills: [analyze-stats]
    paths: [04_analysis/base/analyze-stats/]
    role: reported-stats-audit
    required: true
    prefix_example: "[04_analysis/base/analyze-stats]"
  - id: self-review
    source: my-skills
    skills: [self-review]
    paths: [06_review/base/self-review/]
    role: logic-mechanism-overlay
    required: false
    status_note: covers former scientific-critical-thinking (archived round 3)
    prefix_example: "[self-review]"

force_fine_ids:
  - peer-review  # peer-review-pdf-scan absorbed 2026-10-17 round 2
  - revise
  - self-review  # scientific-critical-thinking archived→self-review round 3

excluded_sources: []
excluded_tools_note: "Out-of-band editors are suggestions-only; no silent numeric edits. Non-base default deny."

swappable: true
