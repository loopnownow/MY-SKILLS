# MY-SKILLS routing index v5.0
# SSOT for session-pick / path resolve. Bodies live under NN_slug/base/ (source my-skills).
# Coarse id = execution seat (02-07). A fine_id carries no coarse field; its bucket is a_domain.
# Session: ask-each-run multi-select fine IDs under the relevant seat. Empty pick -> notify-then-confirm.
# Canonical ID Rule: 00_orchestrator/references/id-rules.md. id is the only runtime identifier.
# path labels / directory names must never be used to infer an id.
# Retired fine ids, retired coarse buckets and the retired 01 seat live in legacy_aliases.yaml only.
# Live rows are status LIVE. Prefer merge into an existing fine id over opening a new one.
# Ownership / Track Changes / citation-verify policy: 00_orchestrator/references/ownership-contract.md

meta:
  version: '5.0'
  change_id: CHG-20261025-stats-path-github
  fine_id_count_canonical: 25
  coarse_id_count: 5

empty_fine_ids: notify-then-research-confirm
session_fine_id_pick: ask-each-run
session_pick_unit: fine_id
coarse_rule: coarse id = execution seat = fine_id a_domain. A fine_id declares no coarse field; a_domain must
  be one of coarse_ids, so a bucket can never drift from its seat.

