# Route contract for 00 fast routing. Unit tests check these strings
# against 00_orchestrator/references/fast-routing.md. Not an LLM router.
# Chinese contains / must_not_contain values are literal owner-utterance match keys.
version: 2
min_routes: 20
routes:
  - intent: literature-search
    contains: ["文献", "03_research"]
  - intent: excel-clean
    contains: ["Excel", "02_data-processing"]
  - intent: sample-size
    contains: ["样本量", "04_analysis"]
  - intent: write-paper
    contains: ["写作", "05_manuscript"]
  - intent: reply-to-reviewers
    contains: ["回复审稿人", "07_response"]
  - intent: skill-evolution
    contains: ["技能迭代", "skill-evolution"]
  - intent: journal-selection
    contains: ["选刊", "03_research"]
  - intent: figures
    contains: ["出图", "04_analysis"]
  - intent: stats
    contains: ["统计", "04_analysis"]
  - intent: polish
    contains: ["润色", "05_manuscript"]
  - intent: de-ai
    contains: ["de-AI", "05_manuscript"]
  - intent: pre-review
    contains: ["预审", "06_review"]
  # ethics forms seat Bai; skill path is B 03_research/base/fill-protocol (no A stub)
  - intent: ethics
    contains: ["伦理申请表", "03_research"]
  - intent: his-extract
    contains: ["HIS", "02_data-processing"]
  - intent: imaging-preprocess
    contains: ["DICOM", "02_data-processing"]
  - intent: coding-principles
    contains: ["coding", "02_data-processing"]
  - intent: translational
    contains: ["clinical-translation", "03_research"]
  - intent: grilling
    contains: ["grill-me", "grilling"]
  - intent: grant
    contains: ["选题", "03_research"]
  - intent: DCA
    contains: ["DCA", "04_analysis"]

# Counter-examples: these must NOT appear as positive routes in the Fast routing section.
counterexamples:
  - intent: journal-selection-misroute-to-05
    must_not_contain: ["选刊 → `05_manuscript`", "journal selection → `05_manuscript`"]
  # Retired path. Venue house style lives in 05_manuscript/base/write-paper/.
  - intent: old-venue-id
    must_not_contain: ["05_manuscript/base/write-venue/"]
  # Retired path. Tone polish lives in 07_response/base/tighten-response/ (mode tone-polish).
  - intent: retired-response-tone-polisher
    must_not_contain: ["07_response/base/response-tone-polisher/"]
  - intent: literature-into-01
    must_not_contain: ["文献 → `01_skill-integration`", "literature → `01_skill-integration`"]
  - intent: reply-into-05
    must_not_contain: ["回复审稿人 → `05_manuscript`", "Reply to reviewers → `05_manuscript`"]
  - intent: reply-into-06
    must_not_contain: ["回复审稿人 → `06_review`", "Reply to reviewers → `06_review`"]
