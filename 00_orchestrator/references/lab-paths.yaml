# Lab path aliases (SSOT). Live skill text cites {alias} or {alias}/relative.
# Agents expand from this file at read time. Do not vendor MY-CODES or _Docs into this git tree.
version: 14
citation_form: "`{alias}` or `{alias}/relative/path` — expand via this YAML"
aliases:
  lab_root: D:\MyProjects  # lab workspace root
  del_root: D:\MyProjects\.Del  # trash and retired park
  raw_root: D:\MyProjects\_DataBase  # raw project data
  code_root: D:\MyProjects\_Docs\GitHub\MY-CODES  # MY-CODES clone (same tree as code_stats)
  doc_root: D:\MyProjects\_Docs  # human-readable docs root
  doc_skill_harvest: D:\MyProjects\_Docs\harvest  # skill-harvest working tree
  skills_git: D:\MyProjects\_Docs\GitHub\MY-SKILLS  # this clone (same tree as skills_runtime)
  skills_runtime: D:\MyProjects\_Docs\GitHub\MY-SKILLS  # runtime checkout (same tree as skills_git)
  rules_git: D:\MyProjects\_Docs\GitHub\MY-RULES  # MY-RULES clone
  doc_lab_ste: D:\MyProjects\_Docs\GitHub\MY-SKILLS\05_manuscript\advanced\lab-ste  # lab STE pack
  jcr2026_xlsx: D:\MyProjects\_Docs\_library\journals\医学投稿推荐_JCR2026.xlsx  # current JCR workbook
  find_journal_submission: D:\MyProjects\_Docs\_library\journals  # journal library (priors, pools, JCR tables)
  doc_library_references: D:\MyProjects\_Docs\_library\references  # off-git library references
  doc_ethics_approvals: D:\MyProjects\_Docs\_library\ethics\approvals  # ethics approval PDFs
  doc_ethics_index: D:\MyProjects\_Docs\_library\ethics\approvals-index.xlsx  # ethics approval index
  doc_glossary: D:\MyProjects\_Docs\_library\glossary  # glossary + evidence banks
  doc_grants: D:\MyProjects\_DataBase\_lab\doc-word\03-research\grants  # grant Word archive
  doc_word_archive: D:\MyProjects\_DataBase\_lab\doc-word  # Word originals archive
  doc_ethics: D:\MyProjects\_Docs\_library\ethics  # ethics library
  code_stats: D:\MyProjects\_Docs\GitHub\MY-CODES  # stats engine and tools (same tree as code_root)
  code_modules: D:\MyProjects\_Docs\GitHub\MY-CODES\modules  # reusable analysis modules
  code_model_validation: D:\MyProjects\_Docs\GitHub\MY-CODES\model-validation  # model-validation CLIs
  code_data_processing: D:\MyProjects\_Docs\GitHub\MY-CODES\tools  # processing tools root
