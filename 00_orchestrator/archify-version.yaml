schema_pins:
  architecture:
    schema_version: 1
    const: true
    why: >
      v3.0.1 architecture.schema.json sets schema_version to the constant 1.
      Workflow and lifecycle are the diagram types that accept 2.
      Do not emit architecture schema_version 2 against this pin.
    fields: [components, boundaries, connections]
  workflow:
    schema_version: 2
    allowed_by_schema: [1, 2]
    why: >
      v3.0.1 schemas/README.md: new workflows use schema_version 2.
      schema_version 1 is the fixed-layout compatibility contract.
      This repository has no legacy workflow geometry to preserve.
    fields: [lanes, phases, groups, mainPath, nodes, edges]
check_policy: >
  Build and CI do not download Archify and do not install latest.
  A separate human-triggered check may compare expected_version with the
  GitHub releases list. A mismatch fails that check and does not change
  this record. Upgrade path: 01 lifecycle check, human confirmation,
  edit this file, then rebuild IR.
