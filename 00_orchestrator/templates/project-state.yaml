# Copy to {lab_root}\<stage>\<project>\ref\project-state.yaml when starting a study (stage: drafting | pre-submit | in-review | accepted).
# study_folder_stage_aliases is the path-segment alias table. It is not pipeline.stage.
# Already-written project folders may still use the alias. Read the alias as the live name. Do not rewrite those folders.
study_folder_stage_aliases:
  preparing: drafting
  polishing: pre-submit
  submitting: in-review
  reseived: accepted
  received: accepted
# Do NOT put VAL_MODE, column names, FIG_PALETTE, GROUP_KEEP here — those stay in ref/settings.ini.
# Leave unknown fields empty. Never invent ethics IDs, n, or AUC.

project: ""          # e.g. fyh_CAC
updated: ""          # YYYY-MM-DD

pipeline:
  sop: ""            # statistics | sci-manuscript | none
  stage: ""          # classify | 02 | 03 | 05 | 06 | qc | done
                     # done: end, or this run's file is on disk and the last gate passed.
                     # pause, or a stop after the results page / before pre-review: leave the current station. Do not write done.
                     # Same defect unresolved after 3 rounds: defects[].status unresolved; do not advance stage.
  last_handoff: ""   # relative path to the last handoff yaml, if any

fine_ids:
  session_picked_fine_ids: []  # selected this run; G0 checks "only picked ids loaded" against this field. Reuse when the next task's fine ids are already here.
  # fine_id_provenance: one object per selected fine id when G0 records it. Do not invent hashes. Do not hash the whole cache.
  # Required fields: fine_id, source, resolved_commit, path, content_hash, checked_at.
  fine_id_provenance: []
  # - fine_id: ""
  #   source: ""
  #   resolved_commit: ""
  #   path: ""
  #   content_hash: ""
  #   checked_at: ""

qc:
  last_gate: ""      # G0 | G-PHI | G-FACT | G-LIT | G-CODE | G-STATS | G-05 | G-06
  last_result: ""    # pass | fail
  # rounds: deprecated aggregate. Prefer defects[].rounds (same defect, max 3). Keep 0 unless a tool still writes it.
  rounds: 0

defects: []
  # - id: D1
  #   node: 02_data-processing
  #   gate: G-STATS
  #   rounds: 0          # recovery rounds on THIS defect; max 3 then status unresolved
  #   status: open | recovered | unresolved
  #   note: ""

study_design:
  question: ""
  hypothesis: ""
  population: ""
  design: ""         # retrospective | prospective | ...
  inclusion: []
  exclusion: []
  ethics_id: ""      # blank = Word comment only (author A); never yellow highlight; do not invent

analysis_plan:
  endpoints: []      # display names; run keys live in settings.ini OUTCOME_COLS
  predictors_intent: ""   # clinical / radiomics / combined — not the feature list
  covariates_intent: ""
  split: "patient-level training vs test"
  models_intent: []  # e.g. [radscore, nomogram]
  notes: ""

manuscript:
  target_journal: ""
  format: "Aitor-format"
  house_docx: ""     # Manuscript_<endpoint>_house.docx
  polished_docx: ""
  results_html: ""   # one HTML per endpoint; numbers only from here
  intro_discussion_lit: pending   # pending | done
  prereview: pending
  reviewer_items: []
  # reviewer_items example:
  # - id: R1-1
  #   status: open | done | cannot_invent
  #   location: ""
  # citation-verify (G-CIT-1 before Gate · 05; G-CIT-2 inside 06). Victor owns; 05/06 do not self-certify.
  citation_verify:
    g_cit_1: ""       # pending | pass | fail
    g_cit_2: ""       # pending | pass | fail | n/a
    table_path: ""    # claim→ref table path when written

# Optional — used by workflows/research-exploration-loop.md (00 sub-component).
# Omit entirely when not exploring. Do not invent medical content here.
exploration_state:
  status: ""              # running | stalled | resolved | ""
  l2_iteration_count: 0
  hop_history: []
  completed: []
  uncertain: []
  missing: []
  invalidated: []
  reusable: []
  resolved_gaps: []
  unresolved_gaps: []
  # stages:            # optional per-stage sketch
  #   literature_search: { status: complete }
  #   gap: { status: partial, classification_confidence: 0.42 }
